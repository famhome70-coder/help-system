<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Help Center</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      position: relative;
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab, #ff007f);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      padding: 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.8;
      animation: float 8s ease-in-out infinite alternate;
      z-index: 1;
    }

    .orb-1 { width: 300px; height: 300px; background: #ff00cc; top: 10%; left: 15%; }
    .orb-2 { width: 350px; height: 350px; background: #3300ff; bottom: 10%; right: 15%; animation-delay: -4s; }
    .orb-3 { width: 200px; height: 200px; background: #00ffff; top: 60%; left: 20%; animation-delay: -2s; }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-40px) rotate(15deg); }
    }

    .help-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 500px;
      padding: 32px 28px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    }

    .help-card h2 {
      text-align: center;
      color: #1f2937;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .chat-box {
      height: 320px;
      overflow-y: auto;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 16px;
      background: #ffffff;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
    }

    .msg.bot {
      background: #f3f4f6;
      color: #1f2937;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .msg.user {
      background: #2563eb;
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .chat-input-area {
      display: flex;
      gap: 10px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 14px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .chat-input-area input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
    }

    .send-btn {
      padding: 14px 22px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
      transition: all 0.3s ease;
    }

    .send-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
    }
  </style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="help-card">
    <h2>🤖 AI Assistant & Help</h2>

    <div class="chat-box" id="chatBox">
      <div class="msg bot">Hello! I am your AI assistant. Ask me anything about this website or report any problem you're facing!</div>
    </div>

    <div class="chat-input-area">
      <input type="text" id="userInput" placeholder="Ask a question or report an issue..." onkeypress="handleKeyPress(event)">
      <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');

      // User Message
      const userMsg = document.createElement('div');
      userMsg.className = 'msg user';
      userMsg.innerText = text;
      chatBox.appendChild(userMsg);

      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      // Bot Loading State
      const botMsg = document.createElement('div');
      botMsg.className = 'msg bot';
      botMsg.innerText = 'Thinking...';
      chatBox.appendChild(botMsg);
      chatBox.scrollTop = chatBox.scrollHeight;

      // Your working API details
      const API_KEY = 'AQ.Ab8RN6KydjgOKhYS7ZLuUfG9suvH1tCw1sLtWCQZlKBgj0bgvw';
      const prompt = `You are an AI support assistant for FamHome. Help the user with any problems or questions they have about the site. If you cannot solve their issue, tell them they can send email feedback to bradley.gunawan@student.citrakasih.sch.id. User question: ${text}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-goog-api-key': API_KEY
          },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await response.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I couldn't process that. Please try asking again!";
        botMsg.innerText = reply;
      } catch (err) {
        botMsg.innerText = "Sorry, I couldn't connect right now. If you need help, please contact FamHome70@gmail.com.";
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>

</body>
</html>
